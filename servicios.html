<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <link rel="stylesheet" href="css/servicios.css" />
  </head>
  <body>
    <header class="header-sitio">
      <div class="contenedor contenedor-header">
        <a href="index.html" class="logo">TaskManager</a>
        <nav class="navegacion">
          <ul>
            <li><a href="index.html" class="activo">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="contenedor">
        <h2>Agenda - Actividades</h2>
        <ul class="task-list" id="lista-actividades">
          <li class="task-item">
            <input type="checkbox" id="actividad-1" />
            <label for="actividad-1">Entregar ensayo de Filosofía</label>
            <span class="tag">Filosofía</span>
            <span class="fecha">Entrega: 20/09/2026</span>
          </li>
        </ul>
        <div class="add-task">
          <input
            type="text"
            id="nueva-actividad"
            placeholder="Nueva actividad"
          />
          <input type="text" id="tag-actividad" placeholder="Categoría" />
          <input type="date" id="fecha-actividad" />
          <button onclick="agregarActividad()">Agregar Actividad</button>
        </div>

        <h2>Agenda - Exámenes</h2>
        <ul class="task-list" id="lista-examenes">
          <li class="task-item">
            <input type="checkbox" id="examen-1" />
            <label for="examen-1">Parcial de Matemáticas II</label>
            <span class="tag">Matemáticas II</span>
            <span class="fecha">Fecha: 25/09/2026</span>
          </li>
        </ul>
        <div class="add-task">
          <input type="text" id="nuevo-examen" placeholder="Nuevo examen" />
          <input type="text" id="tag-examen" placeholder="Materia" />
          <input type="date" id="fecha-examen" />
          <button onclick="agregarExamen()">Agregar Examen</button>
        </div>
      </div>
    </main>

    <footer class="footer-sitio">
      <div class="contenedor contenedor-footer">
        <p>2026 TaskManager. Academico</p>
        <ul class="links-footer">
          <li><a href="servicios.html">Servicios</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </footer>

    <script src="js/servicios.js"></script>
  </body>
</html>
